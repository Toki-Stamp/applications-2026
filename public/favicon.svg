<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Форма нашей скругленной буквы Z (только геометрия, чуть сжали, чтобы влезла жирная обводка) -->
    <path id="z-path" d="M 52,52 L 204,52 L 52,204 L 204,204" 
          fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Превращаем форму Z в маску (трафарет ВЕРНУЛ К ИЗЯЩНЫМ 48px) -->
    <mask id="z-mask">
      <use href="#z-path" stroke="white" stroke-width="48" />
    </mask>

    <!-- Фильтр сильного размытия для смешивания цветов -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>
  
  <!-- Темный контур, повторяющий форму буквы (ОЧЕНЬ ЖИРНЫЙ: 100px) -->
  <use href="#z-path" stroke="#18181b" stroke-width="100" />
  
  <!-- Группа, которая видна ТОЛЬКО внутри буквы Z (применяем трафарет) -->
  <g mask="url(#z-mask)">
    <!-- 4 квадрата с цветами, которые сильно размываются друг в друга -->
    <g filter="url(#blur)">
      <!-- 9 - 12 часов (Левый Верх): Желто-золотой -->
      <rect x="-30" y="-30" width="158" height="158" fill="#eab308" />
      
      <!-- 12 - 3 часа (Правый Верх): Зеленый -->
      <rect x="128" y="-30" width="158" height="158" fill="#22c55e" />
      
      <!-- 3 - 6 часов (Правый Низ): Красный -->
      <rect x="128" y="128" width="158" height="158" fill="#ef4444" />
      
      <!-- 6 - 9 часов (Левый Низ): Синий -->
      <rect x="-30" y="128" width="158" height="158" fill="#3b82f6" />
    </g>
  </g>
</svg>
